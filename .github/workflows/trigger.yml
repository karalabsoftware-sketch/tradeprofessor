# Triggers the paper-trading evaluation.
# Vercel Hobby crons are limited to once/day, so scheduling lives here instead.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   CRON_SECRET   — same value as the Vercel env var of the same name
#   EVALUATE_URL  — https://<your-app>.vercel.app/api/cron/evaluate
#
# Why hourly for a 4h strategy: GitHub's scheduler drops and delays runs,
# especially near the top of the hour. The endpoint only ever acts on the last
# CLOSED 4h candle and replays every candle since the previous run, so polling
# hourly cannot change a single trade — it just means a dropped run heals on
# the next attempt instead of costing a full 4h cycle. Public repos get
# unlimited free Actions minutes, so the extra runs cost nothing.
#
# Minute 23 deliberately avoids the :00-:10 congestion window.

name: papertrade-evaluate

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call evaluate endpoint
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" \
            --retry 2 --retry-delay 10 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.EVALUATE_URL }}")
          echo "HTTP $status"
          cat response.json
          if [ "$status" != "200" ]; then
            echo "::error::evaluate endpoint returned HTTP $status"
            exit 1
          fi
