# BACKUP trigger for the paper-trading evaluation.
#
# The PRIMARY scheduler is external (cron-job.org) — see README "Scheduler".
# GitHub's scheduled trigger proved unreliable for this repo: across two
# different cron expressions it fired ZERO times while every manual dispatch
# succeeded, so it cannot be trusted as the only trigger.
#
# This workflow is kept because it costs nothing (public repos get unlimited
# Actions minutes) and the endpoint is idempotent per candle — if GitHub ever
# does fire, it is harmless redundancy rather than a double evaluation.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   CRON_SECRET   — same value as the Vercel env var of the same name
#   EVALUATE_URL  — https://<your-app>.vercel.app/api/cron/evaluate
#
# Minute 23 deliberately avoids the :00-:10 congestion window and matches
# CONFIG.schedule.pollMinute, which the dashboard uses for "Next check".

name: papertrade-evaluate

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call evaluate endpoint
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" \
            --retry 2 --retry-delay 10 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.EVALUATE_URL }}")
          echo "HTTP $status"
          cat response.json
          if [ "$status" != "200" ]; then
            echo "::error::evaluate endpoint returned HTTP $status"
            exit 1
          fi
